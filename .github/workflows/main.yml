
name: Build Beef Bonus Fabric 1.21

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4

      - name: Pasang Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ekstrak ZIP proyek
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP proyek tidak ditemukan di root repository."
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted

      - name: Cari folder Gradle
        run: |
          PROJECT_DIR=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted -type f \
              \( -name build.gradle -o -name build.gradle.kts \) \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: File build.gradle atau settings.gradle tidak ditemukan."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Folder proyek: $PROJECT_DIR"

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build file JAR
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build

      - name: Simpan JAR untuk diunduh
        uses: actions/upload-artifact@v4
        with:
          name: BeefBonus-Fabric-1.21
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
